[project]
name = "not-yet"
version = "0.1.0"
description = "Analysis and render scripts for the Not Yet music video"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "librosa",
    "soundfile",
    "mido",
    "pretty_midi",
    "faster-whisper",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "scikit-learn>=1.9.1",
    "opencv-python-headless>=5.0.0.93",
    "torch==2.8.*",
    "torchaudio==2.8.*",
    "piano-transcription-inference>=0.0.6",
    "audioread>=3.1.0",
    "music21>=10.5.0",
    "verovio>=6.3.0",
    "cairosvg>=2.9.1",
    "basic-pitch==0.4.0",
    "onnxruntime-gpu>=1.31.0",
    "mir-eval>=0.8.2",
    "resampy==0.4.2",
    "gdown>=6.4.2",
    "pyyaml>=6.0.3",
    "setuptools<81",
    "beat-this",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]  # renders run on Linux boxes only
# basic-pitch pins TensorFlow, which has no wheels for Python 3.12; this project runs its ONNX model (onnxruntime-gpu)
# instead, so TensorFlow and its TF-only helpers are overridden away.
override-dependencies = [
    "tensorflow ; sys_platform == 'never'",
    "tensorflow-macos ; sys_platform == 'never'",
    "tflite-runtime ; sys_platform == 'never'",
    "coremltools ; sys_platform == 'never'",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
]

# CPU PyTorch on the GTX 970 draft box (sm_52 is not in current CUDA builds); switch to cu128 on the RTX 5090 box.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
beat-this = { git = "https://github.com/CPJKU/beat_this.git", rev = "b95c8ab0c58c2d9fcfd40508ae8dffbc05ac4f5c" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
